<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#0a0d17" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="200" height="200" rx="30" fill="url(#bgGrad)" />
  <path d="M 100 20 Q 160 20 165 75 Q 165 140 100 180 Q 35 140 35 75 Q 40 20 100 20 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner Badge -->
  <circle cx="100" cy="85" r="45" fill="#182035" stroke="#FF4D6D" stroke-width="2" />

  <!-- Custom Icon / Symbol -->
  <g transform="translate(100, 85)">
    <path d="M -15 -15 Q 0 -22 15 -15 L 10 15 Q 0 22 -10 15 Z" fill="#FF4D6D"/><text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFF" text-anchor="middle">SBTC</text>
  </g>

  <!-- Title Text -->
  <text x="100" y="152" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SBTC ESPORTS
  </text>
  
  <!-- Subtitle Text -->
  <text x="100" y="168" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#FF4D6D" text-anchor="middle" letter-spacing="0.5">
    LOCKED
  </text>
</svg>